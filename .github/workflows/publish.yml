name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

# A GitHub Release also creates the tag, so both triggers fire for one version.
# Serialize them per tag: the loser then re-checks npm after the winner has
# published and skips, instead of racing it and failing with a 403.
# Never cancel-in-progress — that would kill a run mid-`npm publish`.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Skip if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "playguard@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The registry reads mcpName from the npm package, so it runs only after a
      # fresh npm publish, and waits until npm serves the new version.
      - name: Publish to MCP Registry
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          for i in $(seq 30); do
            npm view "playguard@$VERSION" mcpName >/dev/null 2>&1 && break
            sleep 10
          done
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
